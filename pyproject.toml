[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibedge"
version = "0.2.0"
description = "Leakage-safe on-device bearing and imbalance fault detection from vibration"
readme = "DESIGN.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "requests>=2.31",
  "h5py>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_draft"]
pythonpath = ["src"]
